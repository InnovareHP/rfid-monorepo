name: dashboard

# Infra only by default. App containers are opt-in: --profile apps.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    # Host 5434: local PostgreSQL holds 5432 and another container holds 5433.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Forwards live test-mode events to the better-auth stripe webhook route.
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command:
      - listen
      - --forward-to
      - http://host.docker.internal:8080/api/auth/stripe/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://dashboard:dashboard@postgres:5432/dashboard
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fe:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://api:8080
    depends_on:
      - api

  fe-support:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/fe-support/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://api:8080
    depends_on:
      - api

  landing:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"

volumes:
  pgdata:
  redisdata:
