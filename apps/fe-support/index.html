<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3185" />

    <!-- Primary SEO -->
    <title>Refidly Support</title>
    <meta
      name="description"
      content="Refidly Support: knowledge base, AI assistant, and ticket tracking for healthcare marketing and liaison teams."
    />
    <meta name="author" content="Refidly" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://support.refidly.com" />
    <meta property="og:title" content="Refidly Support" />
    <meta
      property="og:description"
      content="Knowledge base, AI assistant, and ticket tracking for Refidly customers."
    />
    <meta
      property="og:image"
      content="https://support.refidly.com/branding/email-logo.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Red+Hat+Display:wght@300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="/branding/Icon/refidly-icon-colored.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
