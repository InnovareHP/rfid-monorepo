<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Basic Meta -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0d3185" />

        <!-- Primary SEO -->
        <title>Refidly</title>
        <meta
          name="description"
          content="Refidly helps healthcare marketing and liaison teams track facilities, referrals, and field activity in one place."
        />
        <meta
          name="keywords"
          content="refidly, referral tracking, healthcare liaison, analytics dashboard"
        />
        <meta name="author" content="Refidly" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- Open Graph (Facebook, LinkedIn) -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Refidly" />
        <meta
          property="og:description"
          content="Refidly tracks facilities, referrals, and field activity in one place for healthcare marketing and liaison teams."
        />
        <meta property="og:image" content="https://portal.refidly.com/og-image.png" />
        <meta property="og:url" content="https://portal.refidly.com" />

        <!-- Twitter SEO -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Refidly" />
        <meta
          name="twitter:description"
          content="Refidly is built for healthcare marketing and liaison teams."
        />
        <meta name="twitter:image" content="https://portal.refidly.com/og-image.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Red+Hat+Display:wght@300..900&display=swap"
          rel="stylesheet"
        />

        <!-- Icons -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
      </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
